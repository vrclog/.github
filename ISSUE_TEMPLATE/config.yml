# Issue template configuration
# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository

blank_issues_enabled: false

contact_links:
  - name: Security Vulnerability / セキュリティ脆弱性
    url: https://github.com/vrclog/.github/blob/main/SECURITY.md
    about: |
      Please report security vulnerabilities privately via email, not through public issues.
      セキュリティ脆弱性は公開 Issue ではなく、メールでプライベートに報告してください。

  - name: vrclog-go Repository
    url: https://github.com/vrclog/vrclog-go/issues
    about: |
      For issues specific to the vrclog-go library and CLI, open an issue there.
      vrclog-go ライブラリと CLI に特化した問題は、こちらで Issue を作成してください。

  - name: vrclog-adapters Repository
    url: https://github.com/vrclog/vrclog-adapters/issues
    about: |
      For issues specific to community adapters (YamaPlayer, iwaSync3), open an issue there.
      コミュニティアダプター（YamaPlayer、iwaSync3）に特化した問題は、こちらで Issue を作成してください。

  - name: vrclog-companion Repository
    url: https://github.com/vrclog/vrclog-companion/issues
    about: |
      For issues specific to vrclog-companion (Web UI, Discord, API), open an issue there.
      vrclog-companion（Web UI、Discord、API）に特化した問題は、こちらで Issue を作成してください。

  - name: VRChat Support / VRChat サポート
    url: https://help.vrchat.com/
    about: |
      vrclog is NOT affiliated with VRChat Inc. For VRChat app issues, account problems, or official features, please contact VRChat Support.
      vrclog は VRChat Inc. とは提携していません。VRChat アプリの問題、アカウントの問題、公式機能については、VRChat サポートにお問い合わせください。

  - name: Support Guide / サポートガイド
    url: https://github.com/vrclog/.github/blob/main/SUPPORT.md
    about: |
      Read our support guide before opening an issue.
      Issue を作成する前にサポートガイドをお読みください。
